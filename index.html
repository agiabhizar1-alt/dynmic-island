<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050506">
  <title>Notch</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --panel: #050506;
      --text: #fbfbfd;
      --muted: #a7a7af;
      --accent: #c8a9ff;
      --spring: cubic-bezier(.16, 1, .3, 1);
      --collapsed-width: 230px;
      --collapsed-height: 58px;
      --expanded-width: 760px;
      --expanded-height: 86px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      color: var(--text);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      pointer-events: none;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 5px;
    }

    #stage.bottom {
      align-items: flex-end;
      padding-top: 0;
      padding-bottom: 0;
    }

    #island {
      flex: 0 0 auto;
      width: var(--collapsed-width);
      height: var(--collapsed-height);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
      color: var(--text);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      corner-shape: superellipse(1.2);
      box-shadow: 0 12px 30px rgba(0,0,0,.26);
      transform: translateZ(0);
      transition:
        width 430ms var(--spring),
        height 360ms var(--spring),
        border-radius 320ms var(--spring),
        padding 300ms var(--spring),
        transform 430ms var(--spring);
      will-change: width, height;
    }

    #clock {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 680;
      letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
    }

    #media {
      display: none;
      min-width: 0;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 220ms ease, transform 300ms var(--spring);
    }

    #island.playing {
      width: max-content;
      min-width: 300px;
      max-width: min(var(--expanded-width), 900px);
      height: var(--expanded-height);
      padding: 0 28px;
      border-radius: 999px;
    }

    #island.playing #media {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    #island.playing #clock { display: none; }

    .cover {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: white;
      background: linear-gradient(140deg, #8971a8, #e1b5b3 52%, #2c3150);
      font-size: 18px;
    }

    .track {
      min-width: 70px;
      max-width: min(280px, 34vw);
      display: grid;
      gap: 3px;
    }

    #title, #lyric {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #title { font-size: 11px; font-weight: 680; }
    #lyric { color: var(--muted); font-size: 10px; }

    .wave {
      height: 26px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .wave i {
      width: 3px;
      height: 14px;
      border-radius: 4px;
      background: hsl(var(--hue) 88% 73%);
      transform: scaleY(.25);
      animation: equalize 520ms ease-in-out infinite alternate;
      animation-delay: var(--delay);
      will-change: transform;
    }

    .wave i:nth-child(1) { --hue: 190; --delay: 0ms; }
    .wave i:nth-child(2) { --hue: 220; --delay: 90ms; }
    .wave i:nth-child(3) { --hue: 260; --delay: 180ms; }
    .wave i:nth-child(4) { --hue: 300; --delay: 70ms; }
    .wave i:nth-child(5) { --hue: 340; --delay: 150ms; }

    @keyframes equalize {
      to { transform: scaleY(1.65); }
    }

    [data-theme="light"] #island {
      color-scheme: light;
      --panel: #f5f5f7;
      --text: #17171a;
      --muted: #696970;
      --accent: #6941c6;
      border-color: rgba(20,20,24,.12);
      box-shadow: 0 12px 30px rgba(30,30,40,.18);
    }

    [data-theme="glass"] #island {
      --panel: rgba(28,28,32,.82);
      border-color: rgba(255,255,255,.24);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <section id="island" aria-live="polite" aria-label="Dynamic Island">
      <time id="clock">00:00</time>
      <div id="media">
        <span class="cover" aria-hidden="true">♪</span>
        <div class="track">
          <strong id="title"></strong>
          <span id="lyric"></span>
        </div>
        <span class="wave" aria-label="Musik sedang diputar"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const island = document.querySelector("#island");
      const clock = document.querySelector("#clock");
      const title = document.querySelector("#title");
      const lyric = document.querySelector("#lyric");

      const read = (key, fallback) => {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch {
          return fallback;
        }
      };

      const updateClock = () => {
        clock.textContent = new Intl.DateTimeFormat("id-ID", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(new Date());
      };

      const applyTheme = () => {
        document.body.dataset.theme = read("notch-theme", "dark");
      };

      const applyPosition = () => {
        document.querySelector("#stage").classList.toggle(
          "bottom",
          read("notch-position", "top") === "bottom"
        );
      };

      const applySizes = () => {
        let sizes = {};
        try {
          sizes = JSON.parse(read("notch-sizes", "{}"));
        } catch {
          sizes = {};
        }
        const clamp = (value, min, max, fallback) => {
          const number = Number(value);
          return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        };
        document.documentElement.style.setProperty(
          "--collapsed-width",
          `${clamp(sizes.collapsedWidth, 160, 640, 230)}px`
        );
        document.documentElement.style.setProperty(
          "--collapsed-height",
          `${clamp(sizes.collapsedHeight, 42, 110, 58)}px`
        );
        document.documentElement.style.setProperty(
          "--expanded-width",
          `${clamp(sizes.expandedWidth, 320, 900, 760)}px`
        );
        document.documentElement.style.setProperty(
          "--expanded-height",
          `${clamp(sizes.expandedHeight, 50, 110, 86)}px`
        );
      };

      const applyMedia = () => {
        const playing = read("notch-media-playing", "false") === "true";
        const trackTitle = read("notch-media-title", "Scott Street · Phoebe Bridgers");
        const activeLyric = read("notch-active-lyric", "");
        island.classList.toggle("playing", playing);
        title.textContent = trackTitle;
        lyric.textContent = activeLyric;
      };

      window.addEventListener("storage", (event) => {
        if (event.key === "notch-theme") applyTheme();
        if (event.key === "notch-position") {
          applyPosition();
        }
        if (event.key === "notch-sizes") applySizes();
        if (event.key === "notch-media-playing" ||
            event.key === "notch-media-title" ||
            event.key === "notch-active-lyric") applyMedia();
      });

      applyTheme();
      applyPosition();
      applySizes();
      applyMedia();
      updateClock();
      window.setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>
