<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Center</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body { display: grid; place-items: center; }

    button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #f7f7f8;
      background: rgba(18,18,20,.94);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
      cursor: pointer;
      transition: transform 150ms ease, background 180ms ease;
    }

    button:hover { background: rgba(42,42,48,.96); }
    button:active { transform: scale(.92); }
    svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  </style>
</head>
<body>
  <button type="button" aria-label="Buka Control Center" title="Control Center">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="6" rx="3"/><rect x="3" y="13" width="18" height="6" rx="3"/><circle cx="8" cy="8" r="1.5"/><circle cx="16" cy="16" r="1.5"/></svg>
  </button>
  <script>
    document.querySelector("button").addEventListener("click", async () => {
      try {
        await window.__TAURI__.core.invoke("open_control_center");
      } catch (error) {
        console.error("Control Center tidak dapat dibuka:", error);
      }
    });
  </script>
</body>
</html>
